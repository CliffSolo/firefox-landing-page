// Homepage: open ~/Projects/Homepage/index.html in every new tab (installed to /usr/lib/firefox/)
const HOMEPAGE = "file:///home/cliffsolo/Projects/Homepage/index.html";

try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = HOMEPAGE;
} catch (e) {
  Components.utils.reportError(e);
}

// "Restore Session" button: the homepage navigates to HOMEPAGE#restore-session,
// and this restores the previous session (after a restart) or whatever was
// closed last (tabs or a window), the same as Ctrl+Shift+T.
try {
  const RESTORE_URL = HOMEPAGE + "#restore-session";
  let lastRun = 0;

  const restore = (win) => {
    if (Date.now() - lastRun < 2000) return;
    lastRun = Date.now();
    const { SessionStore } = ChromeUtils.importESModule("resource:///modules/sessionstore/SessionStore.sys.mjs");
    if (SessionStore.canRestoreLastSession) {
      SessionStore.restoreLastSession();
      return;
    }
    const { SessionWindowUI } = ChromeUtils.importESModule("resource:///modules/sessionstore/SessionWindowUI.sys.mjs");
    SessionWindowUI.restoreLastClosedTabOrWindowOrSession(win);
  };

  Services.obs.addObserver((win) => {
    win.gBrowser.addTabsProgressListener({
      onLocationChange(browser, webProgress, request, location) {
        if (webProgress.isTopLevel && location.spec === RESTORE_URL) restore(win);
      },
    });
  }, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError(e);
}
